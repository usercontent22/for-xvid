name: Test video metadata collector

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run normalizer tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m py_compile scripts/catalog_utils.py scripts/collect_channel_videos.py scripts/scrape_video_tags.py scripts/audit_video_catalog.py scripts/build_homepage_snapshots.py tests/test_normalizers.py tests/test_video_tags.py tests/test_homepage_snapshots.py
