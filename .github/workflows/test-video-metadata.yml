name: Test video metadata collector

on:
  pull_request:
    paths:
      - "scripts/**"
      - "web/**"
      - "app.py"
      - "templates/**"
      - "public/**"
      - "tests/**"
      - "requirements.txt"
      - "vercel.json"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "web/**"
      - "app.py"
      - "templates/**"
      - "public/**"
      - "tests/**"
      - "requirements.txt"
      - "vercel.json"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile all Python sources
        run: python -m compileall -q app.py web scripts tests
