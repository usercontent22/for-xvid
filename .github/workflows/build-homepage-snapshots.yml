name: Build homepage snapshots

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Number of homepage days to precompute (1–7)"
        required: false
        default: "3"
        type: string
      candidate_limit:
        description: "Candidates per ranking/source database"
        required: false
        default: "3000"
        type: string
  schedule:
    # Daily check is cheap: the script exits before touching Neon while Redis is fresh.
    - cron: "17 8 * * *"

permissions:
  contents: read

concurrency:
  group: homepage-snapshot-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL_3: ${{ secrets.DATABASE_URL_3 }}
      DATABASE_URL_4: ${{ secrets.DATABASE_URL_4 }}
      DATABASE_URL_5: ${{ secrets.DATABASE_URL_5 }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      SNAPSHOT_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.days || '3' }}
      CANDIDATE_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_limit || '3000' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate required database secrets
        shell: bash
        run: |
          for name in DATABASE_URL_3 DATABASE_URL_4 DATABASE_URL_5 REDIS_URL; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret $name. GitHub Actions secrets are separate from Vercel environment variables."
              exit 2
            fi
          done
      - name: Build homepage snapshots with checkpoint-safe retries
        shell: bash
        run: |
          set +e
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            # Never repeat an expensive Neon ranking scan automatically; the next
            # daily check can safely retry if the cache remains stale.
            max_attempts=1
          else
            max_attempts=3
          fi
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Homepage cache build attempt $attempt/$max_attempts."
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              python scripts/build_homepage_snapshots.py \
                --days "$SNAPSHOT_DAYS" \
                --candidate-limit "$CANDIDATE_LIMIT" \
                --skip-if-fresh
              status=$?
            else
              if python scripts/build_homepage_snapshots.py --init-schema-only &&
                python scripts/build_homepage_snapshots.py \
                  --days "$SNAPSHOT_DAYS" \
                  --candidate-limit "$CANDIDATE_LIMIT" \
                  --skip-schema; then
                exit 0
              else
                status=$?
              fi
            fi
            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Homepage cache build failed after $max_attempts attempt(s). Existing DB5 snapshots remain available."
              exit "$status"
            fi

            delay=$((attempt * 10))
            echo "Snapshot build attempt failed with exit code $status; retrying in $delay seconds."
            sleep "$delay"
            attempt=$((attempt + 1))
          done
          exit 1
